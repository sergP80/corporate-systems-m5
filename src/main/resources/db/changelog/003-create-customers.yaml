databaseChangeLog:
  - changeSet:
      id: 003-create-customers
      author: sergii
      changes:
        - createTable:
            schemaName: customers
            tableName: contact
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)

        - createTable:
            schemaName: customers
            tableName: personal
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: birthdate
                  type: DATE

        - createTable:
            schemaName: customers
            tableName: address
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: country_code
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: zip
                  type: VARCHAR(20)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: build_no
                  type: VARCHAR(50)
              - column:
                  name: apartment_no
                  type: VARCHAR(50)

        - createTable:
            schemaName: customers
            tableName: customer
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: personal_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: contact_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: address_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: customers
            baseTableName: customer
            baseColumnNames: personal_id
            referencedTableSchemaName: customers
            referencedTableName: personal
            referencedColumnNames: id
            constraintName: fk_customer_personal

        - addForeignKeyConstraint:
            baseTableSchemaName: customers
            baseTableName: customer
            baseColumnNames: contact_id
            referencedTableSchemaName: customers
            referencedTableName: contact
            referencedColumnNames: id
            constraintName: fk_customer_contact

        - addForeignKeyConstraint:
            baseTableSchemaName: customers
            baseTableName: customer
            baseColumnNames: address_id
            referencedTableSchemaName: customers
            referencedTableName: address
            referencedColumnNames: id
            constraintName: fk_customer_address