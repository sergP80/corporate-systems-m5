databaseChangeLog:
  - changeSet:
      id: 002-create-products
      author: sergii
      changes:
        - createTable:
            schemaName: products
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(2048)
              - column:
                  name: price
                  type: NUMERIC(20,2)
                  constraints:
                    nullable: false
              - column:
                  name: available
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createTable:
            schemaName: products
            tableName: discount
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: percent
                  type: NUMERIC(5,2)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: products
            baseTableName: discount
            baseColumnNames: product_id
            referencedTableSchemaName: products
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_discount_product
            onDelete: CASCADE